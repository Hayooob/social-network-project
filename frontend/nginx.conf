server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded avatars and post images are written by the Go service and
    # referenced as /uploads/<file>. Without this block they 404 in the
    # container even though the files exist.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avatar and post image uploads go through here.
        client_max_body_size 10M;
    }

    # The WebSocket endpoint is the only route that needs the upgrade headers.
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Keep idle sockets open; the app relies on long-lived connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routing: unknown paths fall through to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
