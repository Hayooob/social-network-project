services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-network-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
      - sqlite-data:/app/data
    environment:
      # Read by cmd/main.go; keeps the database on the named volume above so it
      # survives `docker compose down`.
      - DB_PATH=/app/data/social.db
      - PORT=8080
      # The app is served by nginx on port 80 in this setup, so that is the
      # origin the browser sends for API calls and the WebSocket handshake.
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-network-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
